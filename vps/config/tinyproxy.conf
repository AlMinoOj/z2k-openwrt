## z2k: ограниченный HTTP-прокси (tinyproxy :8119). НЕ общий прокси.
## Пропускает ровно два назначения (фильтр /etc/tinyproxy/z2k-filter, в репо —
## config/tinyproxy-z2k-filter):
##   *.cloudflareclient.com — регистрация устройства WARP с роутера, у которого
##     провайдер режет api.cloudflareclient.com;
##   *.entware.net — пакеты Entware для opkg установщика z2k: у части провайдеров
##     bin.entware.net обрывается по объёму (с 11.10.2026, см. z2k_opkg в lib/utils.sh).
## CONNECT — только на 443; обычные http-запросы — только к этим доменам.
User tinyproxy
Group tinyproxy
Port 8119
Listen 0.0.0.0
Timeout 600
DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogFile "/var/log/tinyproxy/tinyproxy.log"
PidFile "/run/tinyproxy/tinyproxy.pid"
LogLevel Info
MaxClients 50
Allow 0.0.0.0/0
BasicAuth z2kwarp <СЕКРЕТ>
## CONNECT allowed only to 443
ConnectPort 443
## Destination allow-list: cloudflareclient.com и entware.net (см. фильтр)
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/z2k-filter"
FilterExtended On
FilterCaseSensitive Off
FilterURLs Off
